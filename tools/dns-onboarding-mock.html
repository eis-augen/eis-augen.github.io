<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alta móvil — VPN</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #0f1419; color: #e7ecf1; margin: 0; padding: 2rem; }
    .card { max-width: 420px; margin: 0 auto; background: #1a2330; border: 1px solid #2d3a4d; border-radius: 12px; padding: 1.5rem; }
    h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
    p { color: #9aa8b6; font-size: .9rem; margin: 0 0 1rem; }
    .qr { width: 200px; height: 200px; margin: 0 auto 1rem; background: repeating-linear-gradient(45deg,#fff 0 8px,#000 8px 16px); border-radius: 8px; opacity: .85; }
    .peer { font-family: Consolas, monospace; font-size: .85rem; background: #0d1117; padding: .75rem; border-radius: 8px; border: 1px solid #30363d; }
    .ok { color: #3fb950; margin-top: 1rem; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WireGuard — operador piloto</h1>
    <p>Escanea el QR con la app oficial. Un dispositivo, un peer.</p>
    <div class="qr" aria-hidden="true"></div>
    <div class="peer">10.66.66.xx · DNS interno activo</div>
    <p class="ok">Estado: configuración lista para entregar al equipo de campo.</p>
  </div>
</body>
</html>
